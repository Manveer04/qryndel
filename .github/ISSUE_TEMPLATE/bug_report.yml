name: Bug report
description: Report a reproducible problem with Qryndel
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private data and credentials before submitting.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest UDL query and SQLite fixture or schema needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Qryndel version, Python version, and operating system.
    validations:
      required: true
