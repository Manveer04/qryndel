[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qryndel"
version = "0.3.0"
description = "A safe, schema-checked query language for SQLite: bound parameters, write guards, budgets and guardrails for AI agents"
license = "MIT"
authors = [{name = "Manveer Singh"}]
keywords = [
    "sqlite", "sql", "query-language", "dsl", "udl", "safe-sql", "sql-injection",
    "query-builder", "query-validation", "schema-validation", "data-contracts",
    "llm", "ai-agents", "guardrails", "database",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "lark>=1.1.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Manveer04/qryndel"
Repository = "https://github.com/Manveer04/qryndel"
Issues = "https://github.com/Manveer04/qryndel/issues"
Documentation = "https://github.com/Manveer04/qryndel/blob/main/docs/language-reference.md"
Changelog = "https://github.com/Manveer04/qryndel/blob/main/CHANGELOG.md"

[project.scripts]
udl = "qryndel.cli:main"

[tool.setuptools.packages.find]
include = ["qryndel*"]

[tool.setuptools.package-data]
qryndel = ["grammar.lark"]
